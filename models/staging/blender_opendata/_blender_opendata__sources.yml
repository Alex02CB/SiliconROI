version: 2

sources:
  - name: blender_opendata
    description: >
      Benchmarks de render de Blender Open Data (licencia CC0). Snapshot diario
      en JSONL cargado en Bronze sin transformar: una fila por línea del fichero.
    database: "{{ env_var('DBT_BRONZE_DB') }}"
    schema: blender_opendata
    config:
      loaded_at_field: _loaded_at
      freshness:
        warn_after: {count: 24, period: hour}
        error_after: {count: 48, period: hour}

    tables:
      - name: submissions
        description: >
          Un envío de benchmark por fila. Conviven cuatro versiones de esquema
          (v1, v2, v3 y v4); solo la v4 se usa en el análisis.
        columns:
          - name: raw
            description: Línea completa del JSONL, tal cual llega (VARIANT).
            data_tests:
              - not_null
          - name: _source_file
            description: Parte del snapshot de la que procede la fila; incluye la fecha del snapshot.
          - name: _source_row
            description: Número de línea dentro de esa parte.
          - name: _loaded_at
            description: Momento en que la fila llegó a Bronze. Lo rellena Snowflake al cargar.
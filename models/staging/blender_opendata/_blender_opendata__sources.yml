version: 2

sources:
  - name: blender_opendata
    description: >
      Benchmarks de render de Blender Open Data (licencia CC0). Snapshot
      descargado una vez y cargado en Bronze sin transformar (D-09): una fila
      por línea del fichero JSONL. No se actualiza cada día.
    database: "{{ env_var('DBT_BRONZE_DB') }}"
    schema: blender_opendata
    config:
      loaded_at_field: _loaded_at
      # Sin control de frescura: es un snapshot estático y siempre
      # parecería antiguo. Si se programan recargas periódicas, se vuelve a
      # activar con umbrales acordes a esa frecuencia (por ejemplo, semanal).
      freshness: null

    tables:
      - name: submissions
        description: >
          Un envío de benchmark por fila. Conviven cuatro versiones de esquema
          (v1, v2, v3 y v4); solo la v4 se usa en el análisis.
        columns:
          - name: raw
            description: Línea completa del JSONL, tal cual llega (VARIANT).
            data_tests:
              - not_null
          - name: _source_file
            description: Parte del snapshot de la que procede la fila; incluye la fecha del snapshot.
          - name: _source_row
            description: Número de línea dentro de esa parte.
          - name: _loaded_at
            description: Momento en que la fila llegó a Bronze. Lo rellena Snowflake al cargar.
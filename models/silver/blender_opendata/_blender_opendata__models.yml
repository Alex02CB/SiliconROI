version: 2

models:
  - name: slv_blender_opendata__benchmark_runs
    description: >
      Ejecuciones del benchmark de Blender (esquema v4), una fila por envío y escena,
      deduplicadas entre snapshots. Incluye envíos incompletos y equipos con varias
      GPUs: se filtran en Gold.
    columns:
      - name: run_id
        description: Clave única de la fila, envío + escena.
        data_tests:
          - unique
          - not_null
      - name: submission_id
        description: Identificador del envío en Blender Open Data.
        data_tests:
          - not_null
      - name: scene_name
        description: Escena renderizada.
        data_tests:
          - accepted_values:
              arguments:
                values: ['monster', 'junkshop', 'classroom']
              config:
                severity: warn
      - name: device_type
        description: Tipo de cálculo (CPU, OPTIX, CUDA, HIP, ONEAPI, METAL).
        data_tests:
          - not_null
      - name: device_name_raw
        description: Nombre del componente tal como lo registra Blender, sin limpiar.
        data_tests:
          - not_null
      - name: num_compute_devices
        description: Número de dispositivos usados. Si es mayor que 1, la puntuación no es comparable.
      - name: blender_version
        description: Versión de Blender del benchmark.
        data_tests:
          - not_null
      - name: samples_per_minute
        description: Puntuación de la escena en muestras por minuto. Más es mejor.
        data_tests:
          - not_null
      - name: run_at
        description: Momento en que se ejecutó la escena.
      - name: created_at
        description: Momento en que se subió el envío.
      - name: snapshot_date
        description: Snapshot del que procede la fila.
      - name: loaded_at
        description: Momento en que la fila llegó a Bronze.
      - name: device_name
        description: >
          Nombre del dispositivo limpio para mostrar (macro clean_device_name):
          sin (R), (TM), generación de Intel ni coletillas del sistema.
        data_tests:
          - not_null

      - name: device_key
        description: >
          device_name en minúsculas: clave para cruzar con el catálogo y con el
          seed mapeo_dispositivos_blender.
        data_tests:
          - not_null
  - name: slv_blender_opendata__device_products
    description: >
      Cruce entre los dispositivos de Blender y los productos del catálogo, una
      fila por pareja dispositivo + producto. Directo por nombre normalizado o
      por las excepciones del seed mapeo_dispositivos_blender.
    columns:
      - name: device_product_id
        description: Clave de la pareja, device_key + producto.
        data_tests: [unique, not_null]
      - name: device_key
        description: Clave del dispositivo en Blender (clean_device_name, as_key=true).
        data_tests: [not_null]
      - name: product_name
        description: Nombre exacto del producto en el catálogo.
        data_tests: [not_null]
      - name: device_kind
        description: Tipo de componente.
        data_tests:
          - accepted_values:
              arguments:
                values: ['cpu', 'gpu']
      - name: match_type
        description: >
          Cómo cruzó: directo (mismo nombre normalizado) o el motivo del seed
          (variante_memoria, sin_graficos_integrados).
        data_tests:
          - accepted_values:
              arguments:
                values: ['directo', 'variante_memoria', 'sin_graficos_integrados']

  - name: slv_blender_opendata__unmapped_devices
    description: >
      Cuarentena: dispositivos de Blender que no cruzan con el catálogo ni por
      el seed. Documenta el hardware fuera de alcance y señala candidatos a
      entrar en el catálogo.
    columns:
      - name: device_key
        description: Clave del dispositivo en Blender.
        data_tests: [unique, not_null]
      - name: device_name
        description: Nombre limpio para mostrar.
      - name: device_types
        description: Backends con los que aparece (CPU, OPTIX, HIP, METAL…).
      - name: submissions
        description: Envíos con este dispositivo.
        data_tests: [not_null]
      - name: first_seen_at
        description: Primer envío con este dispositivo.
      - name: last_seen_at
        description: Último envío con este dispositivo.
      - name: probable_reason
        description: Clasificación aproximada por el nombre, para revisar la cuarentena.
        data_tests:
          - accepted_values:
              arguments:
                values: ['nombre_generico', 'apple', 'servidor_o_pro', 'portatil', 'fuera_de_catalogo']
name: siliconroi
version: '1.0.0'

# Solo se usa al ejecutar dbt en local con profiles.yml.
# En dbt Platform la conexión la definen el entorno y las credenciales.
profile: default

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets: ["target", "dbt_packages"]

# =============================================================================
# Modelos · arquitectura Medallion
# Cada capa escribe en su database, que llega por variable de entorno:
# el mismo código sirve en DEV y en PRO. Bronze no aparece: dbt solo la
# lee con source().
# =============================================================================
models:
  siliconroi:
    +transient: false

    # Staging: renombrar y tipar, 1:1 con Bronze. Vistas: no ocupan espacio.
    staging:
      +materialized: view
      +database: "{{ env_var('DBT_SILVER_DB') }}"
      blender_opendata:
        +schema: blender_opendata
      catalogo:
        +schema: catalogo
      precios:
        +schema: precios

    # Silver: limpieza, deduplicación y FLATTEN. Tablas: es trabajo caro y
    # no queremos repetirlo en cada consulta.
    silver:
      +materialized: table
      +database: "{{ env_var('DBT_SILVER_DB') }}"
      blender_opendata:
        +schema: blender_opendata
      catalogo:
        +schema: catalogo
      precios:
        +schema: precios

    # Gold: consumo. int_ (apoyo), dim_ y fct_ (estrella), agg_ (marts).
    gold:
      +materialized: table
      +database: "{{ env_var('DBT_GOLD_DB') }}"
      intermediate:
        +materialized: view
        +schema: intermediate
      core:
        +schema: core
      marts:
        +schema: marts

# =============================================================================
# Seeds: a Silver, nunca a Bronze (Bronze solo la escribe la ingesta).
# =============================================================================
seeds:
  siliconroi:
    +database: "{{ env_var('DBT_SILVER_DB') }}"
    +schema: seeds


# =============================================================================
# Variables del proyecto
# Parámetros que usan las macros. Se cambian aquí y afectan a todo el proyecto.
# =============================================================================
vars:
  # Tipo de cambio de referencia (1 USD = X EUR). Lo usa la macro usd_to_eur.
  usd_eur_rate: 0.86
  # IVA general en España. Silver lo quita de los precios de tienda (D-06).
  vat_rate: 0.21
name: siliconroi
version: '1.0.0'

# Solo se usa al ejecutar dbt en local con profiles.yml.
# En dbt Platform la conexión la definen el entorno y las credenciales.
profile: default

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets: ["target", "dbt_packages"]

# =============================================================================
# Hooks de proyecto
# Al final de cada ejecución (dbt build, run, test, seed, snapshot), un
# resumen en el log: entorno, nodos correctos y con error, y las filas que ha
# procesado cada modelo incremental. En PRO aparece en el log de cada job.
# =============================================================================
on-run-end:
  - "{{ log_run_summary(results) }}"

# =============================================================================
# Modelos · arquitectura Medallion
# Cada capa escribe en su database, que llega por variable de entorno:
# el mismo código sirve en DEV y en PRO. Bronze no aparece: dbt solo la
# lee con source().
# =============================================================================
models:
  siliconroi:
    +transient: false
    # Gobierno: quién responde de cada modelo. Aparece en la documentación.
    +meta:
      owner: 'J. Alejandro Campillo'

    # Staging: renombrar y tipar, 1:1 con Bronze. Vistas: no ocupan espacio.
    staging:
      +materialized: view
      +database: "{{ env_var('DBT_SILVER_DB') }}"
      blender_opendata:
        +schema: blender_opendata
      catalogo:
        +schema: catalogo
      precios:
        +schema: precios

    # Silver: limpieza, deduplicación y FLATTEN. Tablas: es trabajo caro y
    # no queremos repetirlo en cada consulta.
    silver:
      +materialized: table
      +database: "{{ env_var('DBT_SILVER_DB') }}"
      blender_opendata:
        +schema: blender_opendata
      catalogo:
        +schema: catalogo
      precios:
        +schema: precios

    # Gold: consumo. int_ (apoyo), dim_ y fct_ (estrella), agg_ (marts).
    gold:
      +materialized: table
      +database: "{{ env_var('DBT_GOLD_DB') }}"
      intermediate:
        +materialized: view
        +schema: intermediate
      core:
        +schema: core
      marts:
        +schema: marts
        # Grants declarativos: el rol de consumo (landing) solo lee los marts.
        # dbt los aplica en cada construcción. El rol se crea en
        # setup/07_rol_reporting.sql.
        +grants:
          select: ['SILICONROI_REPORTING_ROLE']

# =============================================================================
# Seeds: a Silver, nunca a Bronze (Bronze solo la escribe la ingesta).
# =============================================================================
seeds:
  siliconroi:
    +database: "{{ env_var('DBT_SILVER_DB') }}"
    +schema: seeds
    +meta:
      owner: 'J. Alejandro Campillo'

# =============================================================================
# Snapshots (SCD tipo 2): historia del catálogo, en Silver.
# No transitorios: con Fail-safe, porque su historia no se puede reconstruir
# desde Bronze.
# =============================================================================
snapshots:
  siliconroi:
    +database: "{{ env_var('DBT_SILVER_DB') }}"
    +schema: snapshots
    +transient: false
    +meta:
      owner: 'J. Alejandro Campillo'


# =============================================================================
# Variables del proyecto
# Parámetros que usan las macros. Se cambian aquí y afectan a todo el proyecto.
# =============================================================================
vars:
  # Tipo de cambio de referencia (1 USD = X EUR). Lo usa la macro usd_to_eur.
  usd_eur_rate: 0.86
  # IVA general en España. Silver lo quita de los precios de tienda.
  vat_rate: 0.21
  # Primer día del histórico de precios: inicio del calendario (dim_date).
  price_history_start: '2025-11-01'
  # Versiones de Blender con las que se calculan las puntuaciones.
  # No se mezclan versiones: cada una cambia el motor de render.
  blender_reference_versions: ['4.5']
  # Envíos mínimos para que la mediana de un producto sea fiable.
  min_benchmark_samples: 10
  # Escala de presupuestos del recomendador, en euros sin IVA.
  budget_min: 800
  budget_max: 5000
  budget_step: 100